name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c "from pathlib import Path; from prepare_site import ensure_site; ensure_site(Path('.'))"
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend_patch/app.js && node --check frontend_patch/updates.js && node --check frontend_patch/exact.js && node --check frontend_patch/admin.js && node --check frontend_patch/market-sync.js
      - run: node --check frontend_patch/catalog-current.js && node --check frontend_patch/catalog-banners.js && node --check frontend_patch/catalog-ui.js && node --check frontend_patch/bank-current.js && node --check frontend_patch/nft-animation.js && node --check frontend_patch/visual-guard.js
      - run: node --check frontend_patch/demo-commerce.js && node --check frontend_patch/demo-ui.js
      - run: node --test tests/market-sync.test.cjs tests/demo-commerce.test.cjs
      - run: python -m compileall -q app.py bank_nfts.py bot_service.py collector.py prepare_site.py settings.py storage.py telegram_auth.py tools
