name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c "from pathlib import Path; from prepare_site import ensure_site; ensure_site(Path('.'))"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py bot_service.py collector.py prepare_site.py settings.py storage.py telegram_auth.py
